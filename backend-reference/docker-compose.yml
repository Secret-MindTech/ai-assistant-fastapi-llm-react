version: '3.8'
services:
  db:
    image: postgres:15
    container_name: chatdb_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatdb
    ports:
      - "5555:5432"
    volumes:
      - chatdb_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  chatdb_data:
